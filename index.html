<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container">
      <div id="game-over"></div>
      <h1>JavaScript Rock Paper Scissors</h1>
      <p>Press the button to choose your hand, first to 5 points wins.</p>
      <div id="buttons">
        <img id="rock" src="./images/rock.png" class="clickable-img" />
        <img id="paper" src="./images/paper.png" class="clickable-img" />
        <img id="scissors" src="./images/scissors.png" class="clickable-img" />
      </div>

      <div id="score">
        Player score: <span id="humanScore">0</span> - Computer score:
        <span id="computerScore">0</span>
      </div>

      <a href="https://github.com/Marentxs" target="_blank"> My GitHub </a>
    </div>

    <footer></footer>

    <script src="javascript.js"></script>
  </body>
</html>
