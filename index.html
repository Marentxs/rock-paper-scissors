<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <h1>JavaScript Rock Paper Scissors</h1>
    <p>Press the button to choose your hand, first to 5 points wins.</p>
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>
    <img src="./images/rock.png" class="clickable-img" />
    <img src="./images/paper.png" class="clickable-img" />
    <img src="./images/scissors.png" class="clickable-img" />

    <div id="score">
      Player score: <span id="humanScore">0</span> - Computer score:
      <span id="computerScore">0</span>
    </div>

    <script src="javascript.js"></script>
  </body>
</html>
